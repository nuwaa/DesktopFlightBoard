<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departures</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="board-container">
    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path id="header-plane-path" d="M2.5 19h19v2h-19zm19.57-9.36c-.21-.8-1.04-1.28-1.84-1.06L14.92 10.5 8.46 4.44l-1.93.51 3.87 6.7-5.66 1.52-2.25-1.75-1.45.39 1.82 3.16.77 1.33 1.6-.43 5.31-1.42 4.35-1.16L21 11.49c.81-.23 1.28-1.05 1.07-1.85z"/>
        </svg>
      </div>
      <div class="header-text">
        <span class="en" id="header-en">Departures</span>
        <span class="ja" id="header-ja">出発</span>
      </div>
      <div class="settings-menu">
        <select id="mode-select">
          <option value="departures">出発</option>
          <option value="arrivals">到着</option>
        </select>
        <select id="filter-select">
          <option value="all">すべて</option>
          <option value="domestic">国内線</option>
          <option value="international">国際線</option>
        </select>
        <select id="airport-select">
          <optgroup label="日本">
            <option value="HND">羽田 (HND)</option>
            <option value="NRT">成田 (NRT)</option>
          </optgroup>
          <optgroup label="台湾 — 本島">
            <option value="TPE">桃園 (TPE)</option>
            <option value="TSA">台北松山 (TSA)</option>
            <option value="RMQ">台中 (RMQ)</option>
            <option value="CYI">嘉義 (CYI)</option>
            <option value="TNN">台南 (TNN)</option>
            <option value="KHH">高雄 (KHH)</option>
            <option value="HUN">花蓮 (HUN)</option>
            <option value="TTT">台東 (TTT)</option>
          </optgroup>
          <optgroup label="台湾 — 離島">
            <option value="MZG">澎湖・馬公 (MZG)</option>
            <option value="WOT">望安 (WOT)</option>
            <option value="CMJ">七美 (CMJ)</option>
            <option value="KNH">金門 (KNH)</option>
            <option value="LZN">馬祖南竿 (LZN)</option>
            <option value="MFK">馬祖北竿 (MFK)</option>
            <option value="GNI">緑島 (GNI)</option>
            <option value="KYD">蘭嶼 (KYD)</option>
          </optgroup>
        </select>
        <svg class="settings-icon" id="settings-button" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
        <svg class="close-icon" id="close-button" viewBox="0 0 24 24" fill="currentColor">
          <title>閉じる (Esc)</title>
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
        <div class="settings-panel" id="settings-panel" hidden>
          <div class="settings-panel-title" id="settings-title">表示言語</div>
          <label><input type="radio" name="lang" value="ja"> 日本語</label>
          <label><input type="radio" name="lang" value="zh"> 繁體中文</label>
        </div>
      </div>
    </div>
    
    <div class="table-header">
      <div class="col-schedule">Schedule<br><span id="th-time-ja">出発時刻</span></div>
      <div class="col-estimated">Estimated<br><span id="th-estimated-ja">変更時刻</span></div>
      <div class="col-destination"><span id="th-endpoint-en">Destination</span><br><span id="th-endpoint-ja">行先</span></div>
      <div class="col-flight">Flight<br><span id="th-flight-ja">便名</span></div>
      <div class="col-terminal">Terminal<br><span id="th-terminal-ja">ターミナル</span></div>
      <div class="col-gate">Gate<br><span id="th-gate-ja">ゲート</span></div>
    </div>
    <div class="table-border"></div>

    <div class="flight-list" id="flight-list">
      <!-- Flights will be populated by JS -->
    </div>
  </div>

  <template id="flight-row-template">
    <div class="flight-row">
      <div class="col-schedule schedule-time"></div>
      <div class="col-estimated estimated-time"></div>
      <div class="col-destination">
        <div class="dest-main"></div>
        <div class="dest-sub"></div>
      </div>
      <div class="col-flight flight-info-container">
        <!-- Main airline -->
        <div class="flight-item main-flight">
          <img class="airline-logo" src="" alt="logo">
          <div class="flight-number"></div>
        </div>
        <!-- Codeshare airline -->
        <div class="flight-item codeshare-flight" style="display: none;">
          <img class="airline-logo" src="" alt="logo">
          <div class="flight-number"></div>
        </div>
      </div>
      <div class="col-terminal terminal-text"></div>
      <div class="col-gate gate-text"></div>
    </div>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
